<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Registration Form</title>
    <style>
        ul {
        list-style-type: none;
        margin: 0%;
        padding: 0%;
        overflow: hidden;
        background: linear-gradient(45deg, #FFCFCF, #d1afe6);
    }
    li {
        float: right;
    }
    .li {
        float: left;
        display: block;
        text-decoration: none;
        padding: 2px;
        color: rgb(114, 5, 5);
    }
    li a {
        display: block;
        text-decoration: none;
        padding: 15px;
        color: rgb(114, 5, 5);
        font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
    }
   
    
   
  
    footer {
        font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        font-size: large;
        background: linear-gradient(45deg, #FFCFCF, #d1afe6);
        padding: 15px;
        margin: 1px;
        text-align: center;
        overflow: hidden;
        color: rgb(114, 5, 5);
    }
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        h2 {
            text-align: center;
            font-size: xx-large;
            color: brown;
        }

        form {
            max-width: 600px;
            margin: auto;
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 0px 10px #ccc;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        td {
            padding: 10px;
            vertical-align: top;
            font-size: 14px;
        }

        label {
            font-size: large;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="date"] {
            width: 100%;
            padding: 8px;
            font-size: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            width: 100%;
            padding: 10px;
            font-size: 25px;
            background-color: #f58a8a;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        div:hover {
            box-shadow: 0px 5px 7px gray;
            transform: scale(1.02);
        }

        button:hover {
            background-color: #f16363;
        }

        /* Media Queries for Responsiveness */
        @media screen and (max-width: 768px) {
            h2 {
                font-size: x-large;
            }
            td {
                display: block;
                width: 100%;
            }
            input[type="text"],
            input[type="email"],
            input[type="password"],
            input[type="date"] {
                font-size: 14px;
                padding: 7px;
            }
            button {
                font-size: 20px;
                padding: 8px;
            }
        }

        @media screen and (max-width: 480px) {
            h2 {
                font-size: large;
            }
            table {
                display: block;
            }
            td {
                display: block;
                width: 100%;
                padding: 8px 5px;
            }
            label {
                font-size: medium;
            }
            input[type="text"],
            input[type="email"],
            input[type="password"],
            input[type="date"] {
                font-size: 13px;
                padding: 6px;
            }
            button {
                font-size: 18px;
                padding: 7px;
            }
        }

        @media screen and (max-width: 600px) {
    .flex-container {
        flex-direction: column;
        align-items: center;
    }
    .flex-container > div {
        width: 90%;
        margin: 10px 0;
    }
    .div {
        width: 90%;
        height: auto;
    }
    ul {
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    li {
        float: none;
        width: 100%;
        text-align: center;
    }
    li a {
        padding: 10px;
    }
    button {
        width: 75%;
    }
}
    </style>
</head>
<body>

     <ul>
        <big><big><b>
                    <li class="li"> <img src="./icon/icons8-ice-cream-sundae-50.png" alt="" width="30px" height="30px">
                        Ice-Cream World</li>
                    <li><a href="contact1.html"><img src="./icon/icons8-contact-us-24.png" alt="" width="17"
                                height="17">Contact Us </a></li>
                    <li><a href="Menu.html"><img src="./icon/icons8-menu-50.png" alt="" width="18" height="18"> Menu
                        </a></li>
                    <li><a href="Register.html"><img src="./icon/icons8-user-24.png" alt="" width="17" height="17">
                            Register</a></li>
                    <li><a href="About.html"><img src="./icon/icons8-about-us-64.png" alt="" width="17" height="17">
                            About Us </a></li>
                    <li><a href="index.html"><img src="./icon/icons8-home-24.png" alt="" width="17" height="17"> Home
                        </a></li>
            </big></big></b>
    </ul>

    <h2>Registration Form</h2>

    <form>
        <table>
            <tr>
                <td><label for="fname">First Name</label></td>
                <td><input type="text" id="fname" name="fname" required></td>
            </tr>
            <tr>
                <td><label for="lname">Last Name</label></td>
                <td><input type="text" id="lname" name="lname" required></td>
            </tr>
            <tr>
                <td><label for="email">Email</label></td>
                <td><input type="email" id="email" name="email" required></td>
            </tr>
            <tr>
                <td><label for="dob">Date of Birth</label></td>
                <td><input type="date" id="dob" name="dob" required></td>
            </tr>
            <tr>
                <td><label for="password">Password</label></td>
                <td><input type="password" id="password" name="password" required></td>
            </tr>
            <br>
            <tr>
                <td colspan="2"><button type="submit">Register</button></td>
            </tr>
        </table>
    </form>
    <br><br>

    </footer>
</body>
</html>
